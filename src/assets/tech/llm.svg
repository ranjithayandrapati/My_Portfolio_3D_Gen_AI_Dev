<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Brain/neural network representing LLM -->
  <!-- Outer circle background -->
  <circle cx="12" cy="12" r="11" fill="#1a1a2e" />
  <!-- Neural nodes -->
  <circle cx="5" cy="8" r="1.5" fill="#a855f7"/>
  <circle cx="5" cy="16" r="1.5" fill="#a855f7"/>
  <circle cx="9.5" cy="5" r="1.5" fill="#a855f7"/>
  <circle cx="9.5" cy="12" r="1.5" fill="#818cf8"/>
  <circle cx="9.5" cy="19" r="1.5" fill="#a855f7"/>
  <circle cx="14.5" cy="8" r="1.5" fill="#818cf8"/>
  <circle cx="14.5" cy="16" r="1.5" fill="#818cf8"/>
  <circle cx="19" cy="12" r="1.5" fill="#a855f7"/>
  <!-- Connections layer 1->2 -->
  <line x1="6.5" y1="8" x2="8" y2="5" stroke="#818cf8" stroke-width="0.6" opacity="0.7"/>
  <line x1="6.5" y1="8" x2="8" y2="12" stroke="#818cf8" stroke-width="0.6" opacity="0.7"/>
  <line x1="6.5" y1="16" x2="8" y2="12" stroke="#818cf8" stroke-width="0.6" opacity="0.7"/>
  <line x1="6.5" y1="16" x2="8" y2="19" stroke="#818cf8" stroke-width="0.6" opacity="0.7"/>
  <line x1="6.5" y1="8" x2="8" y2="19" stroke="#818cf8" stroke-width="0.4" opacity="0.4"/>
  <line x1="6.5" y1="16" x2="8" y2="5" stroke="#818cf8" stroke-width="0.4" opacity="0.4"/>
  <!-- Connections layer 2->3 -->
  <line x1="11" y1="5" x2="13" y2="8" stroke="#818cf8" stroke-width="0.6" opacity="0.7"/>
  <line x1="11" y1="12" x2="13" y2="8" stroke="#818cf8" stroke-width="0.6" opacity="0.7"/>
  <line x1="11" y1="12" x2="13" y2="16" stroke="#818cf8" stroke-width="0.6" opacity="0.7"/>
  <line x1="11" y1="19" x2="13" y2="16" stroke="#818cf8" stroke-width="0.6" opacity="0.7"/>
  <line x1="11" y1="5" x2="13" y2="16" stroke="#818cf8" stroke-width="0.4" opacity="0.4"/>
  <line x1="11" y1="19" x2="13" y2="8" stroke="#818cf8" stroke-width="0.4" opacity="0.4"/>
  <!-- Connections layer 3->4 -->
  <line x1="16" y1="8" x2="17.5" y2="12" stroke="#818cf8" stroke-width="0.6" opacity="0.7"/>
  <line x1="16" y1="16" x2="17.5" y2="12" stroke="#818cf8" stroke-width="0.6" opacity="0.7"/>
</svg>
