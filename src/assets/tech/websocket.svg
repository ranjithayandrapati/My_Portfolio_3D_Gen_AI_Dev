<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <circle cx="12" cy="12" r="11" fill="#0f172a"/>
  <!-- Two-way arrow representing bidirectional connection -->
  <!-- Left node -->
  <circle cx="4.5" cy="12" r="2" fill="#38bdf8"/>
  <!-- Right node -->
  <circle cx="19.5" cy="12" r="2" fill="#38bdf8"/>
  <!-- Top arrow: left to right -->
  <line x1="7" y1="9.5" x2="17" y2="9.5" stroke="#7dd3fc" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="17,9.5 14.5,8.2 14.5,10.8" fill="#7dd3fc"/>
  <!-- Bottom arrow: right to left -->
  <line x1="17" y1="14.5" x2="7" y2="14.5" stroke="#0ea5e9" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="7,14.5 9.5,13.2 9.5,15.8" fill="#0ea5e9"/>
  <!-- WS label lines -->
  <line x1="9.5" y1="19" x2="7" y2="22" stroke="#38bdf8" stroke-width="0.8" opacity="0.5"/>
  <line x1="9.5" y1="19" x2="12" y2="22" stroke="#38bdf8" stroke-width="0.8" opacity="0.5"/>
</svg>
