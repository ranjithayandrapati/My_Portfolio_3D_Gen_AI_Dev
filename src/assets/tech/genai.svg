<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0f172a"/>

  <!-- Brain shape left hemisphere -->
  <path d="M50 22 C38 22 28 30 26 40 C22 42 18 47 19 54 C18 62 24 70 32 72
           C33 78 38 83 45 84 C47 88 50 88 50 88"
        fill="none" stroke="#a855f7" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Brain shape right hemisphere -->
  <path d="M50 22 C62 22 72 30 74 40 C78 42 82 47 81 54 C82 62 76 70 68 72
           C67 78 62 83 55 84 C53 88 50 88 50 88"
        fill="none" stroke="#a855f7" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Brain center divide -->
  <line x1="50" y1="22" x2="50" y2="88" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Left hemisphere folds -->
  <path d="M32 42 Q38 38 42 44 Q44 50 38 54" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M28 56 Q34 52 36 60 Q34 66 30 65" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M36 70 Q42 66 44 72" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Right hemisphere folds -->
  <path d="M68 42 Q62 38 58 44 Q56 50 62 54" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M72 56 Q66 52 64 60 Q66 66 70 65" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M64 70 Q58 66 56 72" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Neural spark dots -->
  <circle cx="50" cy="18" r="2.5" fill="#e879f9"/>
  <circle cx="35" cy="30" r="2"   fill="#e879f9" opacity="0.8"/>
  <circle cx="65" cy="30" r="2"   fill="#e879f9" opacity="0.8"/>
  <circle cx="22" cy="52" r="2"   fill="#e879f9" opacity="0.7"/>
  <circle cx="78" cy="52" r="2"   fill="#e879f9" opacity="0.7"/>

  <!-- Sparkle top -->
  <line x1="50" y1="9"  x2="50" y2="14" stroke="#f0abfc" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="47" y1="11" x2="53" y2="11" stroke="#f0abfc" stroke-width="1.5" stroke-linecap="round"/>
</svg>
